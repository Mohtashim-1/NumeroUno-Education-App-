<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token or frappe.session.csrf_token }}">
  <title>Customer Code Lookup — NumeroUNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a1c24;
      --ink-soft: #16303a;
      --paper: #f7f4ee;
      --sand: #ebe4d6;
      --sea: #0f6e66;
      --sea-deep: #0a524c;
      --sea-mist: #d9efec;
      --gold: #c9a227;
      --muted: #5a6b73;
      --line: rgba(10, 28, 36, 0.12);
      --ok: #1b7a4a;
      --shadow: 0 28px 70px rgba(10, 28, 36, 0.16);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 480px at 8% -8%, rgba(15, 110, 102, 0.18), transparent 55%),
        radial-gradient(820px 420px at 100% 0%, rgba(201, 162, 39, 0.14), transparent 50%),
        linear-gradient(165deg, #eef5f4 0%, var(--paper) 42%, var(--sand) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        linear-gradient(rgba(10,28,36,.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,28,36,.8) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 20%, #000 20%, transparent 75%);
    }

    button, input { font: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 72px;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      animation: rise 0.55s ease both;
    }
    .brand img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(10,28,36,0.1);
    }
    .brand-mark {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-name {
      font-family: "Fraunces", serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .hero {
      margin-bottom: 22px;
      animation: rise 0.65s ease 0.05s both;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-family: "Fraunces", serif;
      font-size: clamp(1.9rem, 4vw, 2.55rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 36ch;
    }

    .panel {
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      animation: rise 0.7s ease 0.12s both;
    }

    .mode-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .mode-btn {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      background: rgba(10,28,36,0.04);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .mode-btn:hover { color: var(--ink); background: rgba(10,28,36,0.07); }
    .mode-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--sea), var(--sea-deep));
      box-shadow: 0 8px 20px rgba(15,110,102,0.28);
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 18px 52px 18px 52px;
      border-radius: 18px;
      border: 1.5px solid var(--line);
      background: #fff;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-wrap input:focus {
      border-color: var(--sea);
      box-shadow: 0 0 0 4px rgba(15,110,102,0.12);
    }
    .search-icon, .search-clear {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
    }
    .search-icon { left: 10px; pointer-events: none; }
    .search-clear {
      right: 8px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .search-clear.show {
      opacity: 1;
      pointer-events: auto;
    }
    .search-clear:hover { background: rgba(10,28,36,0.06); color: var(--ink); }

    .hint {
      margin: 12px 4px 0;
      font-size: 0.84rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .results {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: rise 0.4s ease both;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(15,110,102,0.28);
      box-shadow: 0 14px 30px rgba(10,28,36,0.08);
    }
    .card.disabled { opacity: 0.62; }

    .code-pill {
      min-width: 78px;
      text-align: center;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--sea-mist);
      color: var(--sea-deep);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .card-body { min-width: 0; }
    .card-name {
      font-weight: 650;
      font-size: 1rem;
      line-height: 1.3;
      margin: 0 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      background: rgba(10,28,36,0.04);
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--sea-mist);
      color: var(--sea-deep);
    }
    .icon-btn.copied {
      background: rgba(27,122,74,0.12);
      color: var(--ok);
      transform: scale(1.05);
    }

    .empty, .login-card {
      text-align: center;
      padding: 36px 18px 28px;
      color: var(--muted);
    }
    .empty-icon, .login-card .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--sea-mist);
      color: var(--sea-deep);
    }
    .empty h3, .login-card h3 {
      margin: 0 0 6px;
      color: var(--ink);
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
    }
    .empty p, .login-card p {
      margin: 0 auto;
      max-width: 34ch;
      line-height: 1.45;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 12px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--sea), var(--sea-deep));
      color: #fff;
      font-weight: 650;
      box-shadow: 0 10px 24px rgba(15,110,102,0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15,110,102,0.34);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      box-shadow: 0 12px 30px rgba(10,28,36,0.28);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(15,110,102,0.2);
      border-top-color: var(--sea);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 6px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 560px) {
      .shell { padding-top: 28px; }
      .card { grid-template-columns: auto 1fr; }
      .card-actions { grid-column: 1 / -1; justify-content: flex-end; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <img src="https://erp.nutc.cloud/files/nutclogo.jpg" alt="NUTC" />
      <div class="brand-mark">
        <div class="brand-name">NumeroUNO</div>
      </div>
    </div>

    {% if is_guest %}
    <div class="hero">
      <h1>Find customers</h1>
    </div>
    <div class="panel">
      <div class="login-card">
        <a class="btn-primary" href="{{ login_url }}">Sign in</a>
      </div>
    </div>
    {% else %}
    <div class="hero">
      <h1>Find customers</h1>
    </div>

    <div class="panel">
      <div class="mode-row" role="tablist" aria-label="Search mode">
        <button type="button" class="mode-btn active" data-mode="auto">Smart</button>
        <button type="button" class="mode-btn" data-mode="name">By Name</button>
        <button type="button" class="mode-btn" data-mode="code">By Code</button>
      </div>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input
          id="query"
          type="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Name or code"
          autofocus
        />
        <button type="button" class="search-clear" id="clearBtn" aria-label="Clear search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="results" id="results"></div>
    </div>
    {% endif %}
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  {% if not is_guest %}
  <script>
    (() => {
      const API = "numerouno.numerouno.customer_code_portal.lookup_customer";
      const input = document.getElementById("query");
      const resultsEl = document.getElementById("results");
      const hintEl = document.getElementById("hint");
      const clearBtn = document.getElementById("clearBtn");
      const toastEl = document.getElementById("toast");
      const modeBtns = [...document.querySelectorAll(".mode-btn")];
      let mode = "auto";
      let timer = null;
      let seq = 0;
      let toastTimer = null;

      const csrf = document.querySelector('meta[name="csrf-token"]')?.content || "";

      modeBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          mode = btn.dataset.mode;
          modeBtns.forEach((b) => b.classList.toggle("active", b === btn));
          input.placeholder =
            mode === "code" ? "Code" : mode === "name" ? "Name" : "Name or code";
          runSearch();
          input.focus();
        });
      });

      input.addEventListener("input", () => {
        clearBtn.classList.toggle("show", !!input.value.trim());
        clearTimeout(timer);
        timer = setTimeout(runSearch, 220);
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          input.value = "";
          clearBtn.classList.remove("show");
          runSearch();
        }
      });

      clearBtn.addEventListener("click", () => {
        input.value = "";
        clearBtn.classList.remove("show");
        runSearch();
        input.focus();
      });

      async function runSearch() {
        const query = input.value.trim();
        const mySeq = ++seq;

        if (!query) {
          resultsEl.innerHTML = "";
          hintEl.innerHTML = "";
          return;
        }

        hintEl.innerHTML = `<span class="spinner"></span>`;

        try {
          const data = await call(API, { query, mode, limit: 12 });
          if (mySeq !== seq) return;
          render(data.results || [], data.mode, query);
        } catch (err) {
          if (mySeq !== seq) return;
          hintEl.textContent = "";
          resultsEl.innerHTML = "";
        }
      }

      function render(rows, usedMode, query) {
        hintEl.textContent = "";
        if (!rows.length) {
          resultsEl.innerHTML = "";
          return;
        }

        resultsEl.innerHTML = rows
          .map((row, i) => {
            const code = row.customer_code || "—";
            const meta = [row.customer_group, row.territory].filter(Boolean).join(" · ");
            const disabled = row.disabled ? " disabled" : "";
            const badge = row.disabled ? " · Disabled" : "";
            return `
              <article class="card${disabled}" style="animation-delay:${i * 0.04}s">
                <div class="code-pill" title="Customer Code">${escapeHtml(code)}</div>
                <div class="card-body">
                  <h3 class="card-name">${escapeHtml(row.customer_name)}</h3>
                  <p class="card-meta">${escapeHtml(meta || "Customer")}${badge}</p>
                </div>
                <div class="card-actions">
                  <button type="button" class="icon-btn" data-copy="${escapeAttr(code)}" data-label="Code" title="Copy code" ${code === "—" ? "disabled" : ""}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  </button>
                  <button type="button" class="icon-btn" data-copy="${escapeAttr(row.customer_name)}" data-label="Name" title="Copy name">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
                  </button>
                  <a class="icon-btn" href="${escapeAttr(row.url)}" title="Open customer" target="_blank" rel="noopener">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                  </a>
                </div>
              </article>`;
          })
          .join("");

        resultsEl.querySelectorAll("[data-copy]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const value = btn.getAttribute("data-copy") || "";
            const label = btn.getAttribute("data-label") || "Value";
            try {
              await navigator.clipboard.writeText(value);
              btn.classList.add("copied");
              showToast(`${label} copied`);
              setTimeout(() => btn.classList.remove("copied"), 900);
            } catch (_) {
              showToast("Could not copy");
            }
          });
        });
      }

      async function call(method, args) {
        const body = new URLSearchParams();
        body.set("cmd", method);
        Object.entries(args || {}).forEach(([k, v]) => body.set(k, v == null ? "" : String(v)));
        const res = await fetch("/", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
            "X-Frappe-CSRF-Token": csrf,
            Accept: "application/json",
          },
          body,
          credentials: "same-origin",
        });
        const json = await res.json();
        if (json.exc_type || json.exception) {
          throw new Error((json._server_messages && safeMsg(json._server_messages)) || json.exception || "Request failed");
        }
        return json.message;
      }

      function safeMsg(raw) {
        try {
          const arr = JSON.parse(raw);
          const first = JSON.parse(arr[0] || "{}");
          return first.message || "Request failed";
        } catch (_) {
          return "Request failed";
        }
      }

      function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(str) {
        return escapeHtml(str).replace(/'/g, "&#39;");
      }

      // Prefill from URL ?q=
      const params = new URLSearchParams(location.search);
      if (params.get("q")) {
        input.value = params.get("q");
        clearBtn.classList.add("show");
        runSearch();
      }
    })();
  </script>
  {% endif %}
</body>
</html>
