<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Certificate Verification</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const cert = params.get("cert") || params.get("certNumber") || "";
            const name = params.get("name") || "";
            const target = new URL("https://nutc.ae/verify");

            if (cert) {
                target.searchParams.set("certNumber", cert);
            }

            if (name) {
                target.searchParams.set("name", name);
            }

            window.location.replace(target.toString());
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=https://nutc.ae/verify">
</head>
<body>
    <p>Redirecting to <a href="https://nutc.ae/verify">https://nutc.ae/verify</a>...</p>
</body>
</html>
